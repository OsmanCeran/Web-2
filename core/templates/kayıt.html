{% load static %}
<!DOCTYPE html>

<html class="light" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kayıt Ekranı</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#98CD00",
            "background-light": "#D1F1FF",
            "background-dark": "#010610",
            "text-light": "#010610",
            "text-dark": "#D1F1FF",
          },
          fontFamily: {
            "display": ["Lexend", "sans-serif"]
          },
          borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
        },
      },
    }
  </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark">
<div class="relative flex min-h-screen w-full flex-col group/design-root">
<header class="absolute top-0 left-0 right-0 z-10 p-4">
<div class="container mx-auto flex items-center justify-between px-4 sm:px-6 lg:px-8">
<div class="flex items-center gap-3">
<div class="size-8 text-text-light dark:text-text-dark">
<svg fill="currentColor" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M42.4379 44C42.4379 44 36.0744 33.9038 41.1692 24C46.8624 12.9336 42.2078 4 42.2078 4L7.01134 4C7.01134 4 11.6577 12.932 5.96912 23.9969C0.876273 33.9029 7.27094 44 7.27094 44L42.4379 44Z"></path>
</svg>
</div>
<a href="{% url 'index' %}"><h2 class="text-xl font-bold">FORMLAB</h2></a>
</div>
<a class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-transparent text-text-light dark:text-text-dark text-sm font-bold border-2 border-primary hover:bg-primary/20 transition-colors" href="#">
<span class="truncate">Giriş Yap</span>
</a>
</div>
</header>
<main class="flex h-full min-h-screen grow flex-col">
<div class="flex flex-1 items-center justify-center">
<div class="container mx-auto flex w-full max-w-6xl flex-col items-center justify-center p-4 lg:flex-row lg:p-0">
<div class="hidden lg:flex lg:w-1/2 lg:items-center lg:justify-center p-8">
<div class="w-full aspect-square bg-center bg-no-repeat bg-cover rounded-xl" data-alt="A person tying their running shoes in a park setting." style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuD8zIjXYvryvjj7-B6mO7TPHDJi6io9h5vtTUowVbOnzFxIuUsZkr54x4pMUUzpYPAA2gltzTLzKZzvPfbubTgcj4Rusu_xltgBa-i3R6ZeB1LV78-GhbE_2VjT8S3QwSbsK73N6KAbIkVQM_cNyWKxjaEKgtxpBwFu_0A8SQnvnfLE6hiy8qeeu-snSk5ME4gONfdJq6ycatcRfi890wlhel7Q-nAgVOKJUeMAwucHET81Xw7IEXTLa3C3xoDCleUabL8EA9P0Wo0");'></div>
</div>
<div class="w-full max-w-md lg:w-1/2 p-4 sm:p-8">
<div class="flex flex-col gap-6 w-full">
<div class="flex flex-col gap-2 text-left">
<h1 class="text-4xl font-black leading-tight tracking-[-0.033em] sm:text-5xl">Hesabını Oluştur</h1>
<h2 class="text-base font-normal leading-normal">Sağlıklı bir yaşama ilk adımı at.</h2>
</div>
<form class="flex flex-col gap-4">
<div class="flex flex-wrap items-end gap-4">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-base font-medium leading-normal pb-2">İsim</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-text-light/20 bg-white/50 h-14 placeholder:text-text-light/50 p-[15px] text-base font-normal leading-normal dark:bg-background-dark/50 dark:text-text-dark dark:placeholder:text-text-dark/50 dark:border-text-dark/20" placeholder="İsminizi girin" value=""/>
</label>
<label class="flex flex-col min-w-40 flex-1">
<p class="text-base font-medium leading-normal pb-2">Soyisim</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-text-light/20 bg-white/50 h-14 placeholder:text-text-light/50 p-[15px] text-base font-normal leading-normal dark:bg-background-dark/50 dark:text-text-dark dark:placeholder:text-text-dark/50 dark:border-text-dark/20" placeholder="Soyisminizi girin" value=""/>
</label>
</div>
<div class="flex flex-wrap items-end gap-4">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-base font-medium leading-normal pb-2">Yaş</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-text-light/20 bg-white/50 h-14 placeholder:text-text-light/50 p-[15px] text-base font-normal leading-normal dark:bg-background-dark/50 dark:text-text-dark dark:placeholder:text-text-dark/50 dark:border-text-dark/20" placeholder="Yaşınızı girin" type="number" value=""/>
</label>
<div class="flex flex-col min-w-40 flex-1">
<p class="text-base font-medium leading-normal pb-2">Cinsiyet</p>
<div class="relative">
<select class="form-select appearance-none w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-text-light/20 bg-white/50 h-14 placeholder:text-text-light/50 p-[15px] text-base font-normal leading-normal dark:bg-background-dark/50 dark:text-text-dark dark:placeholder:text-text-dark/50 dark:border-text-dark/20">
<option value="">Seçiniz</option>
<option value="kadin">Kadın</option>
<option value="erkek">Erkek</option>
<option value="diger">Diğer</option>
</select>
<span class="material-symbols-outlined pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-text-light dark:text-text-dark" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<div class="flex flex-wrap items-end gap-4">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-base font-medium leading-normal pb-2">Boy (cm)</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-text-light/20 bg-white/50 h-14 placeholder:text-text-light/50 p-[15px] text-base font-normal leading-normal dark:bg-background-dark/50 dark:text-text-dark dark:placeholder:text-text-dark/50 dark:border-text-dark/20" placeholder="Boyunuzu girin" type="number" value=""/>
</label>
<label class="flex flex-col min-w-40 flex-1">
<p class="text-base font-medium leading-normal pb-2">Kilo (kg)</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-text-light/20 bg-white/50 h-14 placeholder:text-text-light/50 p-[15px] text-base font-normal leading-normal dark:bg-background-dark/50 dark:text-text-dark dark:placeholder:text-text-dark/50 dark:border-text-dark/20" placeholder="Kilonuzu girin" type="number" value=""/>
</label>
</div>
<div class="flex items-start gap-2 pt-2">
<input class="form-checkbox mt-1 h-5 w-5 rounded border-text-light/30 text-primary focus:ring-primary focus:ring-offset-background-light dark:focus:ring-offset-background-dark dark:border-text-dark/30" id="terms" type="checkbox"/>
<label class="text-sm" for="terms">
<a class="font-bold underline hover:text-primary" href="#">Hizmet Şartları</a>'nı ve <a class="font-bold underline hover:text-primary" href="#">Gizlilik Politikası</a>'nı okudum ve kabul ediyorum.
                  </label>
</div>
<button class="flex min-w-[84px] max-w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 mt-4 bg-primary text-background-dark text-base font-bold leading-normal tracking-[0.015em] hover:brightness-110 transition-all">
<span class="truncate">Kayıt Ol</span>
</button>
</form>
<p class="text-center text-sm mt-4">
                Zaten bir hesabın var mı? <a class="font-bold text-primary hover:underline" href="{% url 'giris' %}">Giriş Yap</a>
</p>
</div>
</div>
</div>
</div>
</main>
</div>
</body></html>
